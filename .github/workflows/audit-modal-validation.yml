name: Audit and preserve completed graph modal validation
on:
  workflow_dispatch:
    inputs:
      validation_run:
        description: Completed twenty-case validation run
        required: true
        type: string
      validation_head:
        description: Exact forty-character source commit of that run
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '4'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      VALIDATION_RUN: ${{ inputs.validation_run }}
      VALIDATION_HEAD: ${{ inputs.validation_head }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the completed source run and its twenty artifacts
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          run=os.environ['VALIDATION_RUN'];head=os.environ['VALIDATION_HEAD'];repo=os.environ['GITHUB_REPOSITORY']
          assert re.fullmatch(r'[0-9]{1,20}',run) and re.fullmatch(r'[a-f0-9]{40}',head)
          def api(path):return json.loads(subprocess.check_output(['gh','api',path],text=True))
          metadata=api(f'repos/{repo}/actions/runs/{run}')
          assert metadata['head_sha']==head and metadata['status']=='completed' and metadata['conclusion']=='success'
          assert metadata['path']=='.github/workflows/comsol-modal-validation.yml'
          artifacts=api(f'repos/{repo}/actions/runs/{run}/artifacts?per_page=100')
          names={f'graph-modal-{s}-{c:02d}' for s in ['hann','gaussian','rectangular','chirp'] for c in [1,3,5,10,20]}
          assert artifacts['total_count']==20 and {a['name'] for a in artifacts['artifacts']}==names
          for item in artifacts['artifacts']:
              assert not item['expired'] and 0<item['size_in_bytes']<=256*1024**2
              assert re.fullmatch(r'sha256:[a-f0-9]{64}',item['digest'])
          assert sum(a['size_in_bytes'] for a in artifacts['artifacts'])<=4*1024**3
          Path('provenance').mkdir()
          for name,value in [('validation-run.json',metadata),('validation-artifacts.json',artifacts)]:
              Path('provenance',name).write_text(json.dumps(value,indent=2)+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validation_run }}
          pattern: graph-modal-*
          path: downloaded-validation
      - name: Install the pinned offline numerical runtime
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 numba==0.63.1 llvmlite==0.46.0
      - name: Verify the published candidate
        run: |
          gh release download v0.3.0 --repo "$GITHUB_REPOSITORY" --pattern WorkAI-GraphModal-research-v11-phase-ci.zip --dir model-download
          python - <<'PY'
          import hashlib,stat,zipfile
          from pathlib import Path,PurePosixPath
          archive=Path('model-download/WorkAI-GraphModal-research-v11-phase-ci.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='990d8000130fad94d455da69f3608ccc277d9eaaa35bbbf981360b044625cfac'
          with zipfile.ZipFile(archive) as zipped:
              assert len(zipped.infolist())<=256 and sum(x.file_size for x in zipped.infolist())<=512*1024**2
              for item in zipped.infolist():
                  path=PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in item.filename
                  assert not stat.S_ISLNK(item.external_attr>>16)
              zipped.extractall('model')
          PY
      - name: Independently audit actual saved trajectories and COMSOL comparisons
        run: >-
          python tools/audit-modal-matrix.py
          --ci-root downloaded-validation --model model
          --plan research/comsol-validation/plans/v11-quarter-driven.json
          --reference research/comsol-validation/data/eigen-graded20-030-v11
          --refinement research/comsol-validation/data/eigen-graded20-035-v11
          --output audit
      - name: Build bounded evidence archives without changing scientific status
        run: |
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          output=Path('release-evidence');output.mkdir()
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as file:
                  for block in iter(lambda:file.read(4*1024**2),b''):h.update(block)
              return h.hexdigest()
          manifest={}
          for signal in ['hann','gaussian','rectangular','chirp']:
              target=output/f'WorkAI-GraphModal-v11-driven-{signal}-5ms.zip'
              with zipfile.ZipFile(target,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as zipped:
                  for cycles in [1,3,5,10,20]:
                      case=f'{signal}-{cycles:02d}';folder=Path('downloaded-validation')/('graph-modal-'+case)/case
                      for path in sorted(folder.iterdir()):
                          assert path.is_file() and not path.is_symlink()
                          zipped.write(path,case+'/'+path.name)
                      zipped.write(Path('audit')/(case+'.json'),case+'/independent-audit.json')
              assert target.stat().st_size<1900*1024**2
              with zipfile.ZipFile(target) as zipped:assert zipped.testzip() is None
              manifest[target.name]={'bytes':target.stat().st_size,'sha256':digest(target)}
          summary=output/'WorkAI-GraphModal-v11-driven-audit.zip'
          with zipfile.ZipFile(summary,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as zipped:
              for folder in [Path('audit'),Path('provenance')]:
                  for path in sorted(folder.rglob('*')):
                      if path.is_file():zipped.write(path,str(path))
              for name in ['model.json','weights.npz']:zipped.write(Path('model')/name,'model/'+name)
              for path in sorted(Path('tools').glob('*modal*.py')):zipped.write(path,str(path))
              path=Path('research/comsol-validation/plans/v11-quarter-driven.json');zipped.write(path,str(path))
              path=Path('research/comsol-validation/CONTINUATION-V11.md');zipped.write(path,str(path))
          with zipfile.ZipFile(summary) as zipped:assert zipped.testzip() is None
          manifest[summary.name]={'bytes':summary.stat().st_size,'sha256':digest(summary)}
          Path(output/'WorkAI-GraphModal-v11-driven-manifest.json').write_text(json.dumps({
              'files':manifest,'scientific_accuracy_certified':False,
              'scope':'Complete candidate nonlinear trajectories and separate linear COMSOL reference checks; no full-duration nonlinear COMSOL certificate'},indent=2)+'\n')
          Path(output/'WorkAI-GraphModal-v11-driven-SHA256SUMS.txt').write_text(''.join(value['sha256']+'  '+name+'\n' for name,value in manifest.items()))
          print(json.dumps(manifest,indent=2))
          PY
      - name: Publish distinct research evidence assets
        run: gh release upload v0.3.0 release-evidence/* --repo "$GITHUB_REPOSITORY"
      - name: Preserve the small audit and its provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-modal-v11-driven-audit
          path: |
            audit/
            provenance/
            release-evidence/*manifest.json
            release-evidence/*SHA256SUMS.txt
          retention-days: 30
