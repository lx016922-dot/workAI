name: Native COMSOL comparison with candidate modal and time refinements
on:
  workflow_dispatch:
    inputs:
      model_asset:
        description: Compiled 500-mode research ZIP on release v0.3.0
        required: true
        type: string
      model_sha256:
        description: SHA-256 of the complete compiled model archive
        required: true
        type: string
permissions:
  contents: read
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: modes300
            modes: '300'
            step: '0.025'
          - label: modes500
            modes: '500'
            step: '0.025'
          - label: time500
            modes: '500'
            step: '0.0125'
    env:
      OPENBLAS_NUM_THREADS: '4'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      WORKAI_MODEL_ASSET: ${{ inputs.model_asset }}
      WORKAI_MODEL_SHA256: ${{ inputs.model_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical runtime
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 numba==0.63.1 llvmlite==0.46.0
      - name: Validate explicit archive identity
        run: |
          python - <<'PY'
          import os,re
          assert re.fullmatch(r'WorkAI-GraphModal-research-[a-z0-9-]+[.]zip',os.environ['WORKAI_MODEL_ASSET'])
          assert re.fullmatch(r'[a-f0-9]{64}',os.environ['WORKAI_MODEL_SHA256'])
          PY
      - name: Download and verify the compiled research candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.3.0 --repo "$GITHUB_REPOSITORY" --pattern "$WORKAI_MODEL_ASSET" --dir download
          python - <<'PY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path,PurePosixPath
          path=Path('download')/os.environ['WORKAI_MODEL_ASSET']
          assert hashlib.sha256(path.read_bytes()).hexdigest()==os.environ['WORKAI_MODEL_SHA256']
          with zipfile.ZipFile(path) as archive:
              entries=archive.infolist()
              assert len(entries)<=256 and sum(x.file_size for x in entries)<=512*1024*1024
              for entry in entries:
                  name=PurePosixPath(entry.filename)
                  assert not name.is_absolute() and '..' not in name.parts and '\\' not in entry.filename
                  assert not stat.S_ISLNK(entry.external_attr>>16)
              archive.extractall('model')
          assert json.loads(Path('model/model.json').read_text())['exported_modes']==500
          PY
      - name: Save all predictions before loading the archived native reference
        run: >-
          python tools/run-modal-candidate-case.py --model model
          --plan research/comsol-validation/plans/v11-quarter-native-driven.json
          --case native-20us --modes '${{ matrix.modes }}' --step-us '${{ matrix.step }}'
          --native-reference research/comsol-validation/data/native-quarter-075-20us-v11
          --output validation
      - name: Preserve raw evidence without an accuracy assertion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-refinement-${{ matrix.label }}
          path: validation/
          retention-days: 30
  audit:
    needs: predict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical runtime
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 numba==0.63.1 llvmlite==0.46.0
      - uses: actions/download-artifact@v4
        with:
          pattern: native-refinement-*
          path: evidence
      - name: Independently compare unchanged-basis refinements
        run: >-
          python tools/check-modal-refinements.py
          --lower-modes evidence/native-refinement-modes300/native-20us
          --higher-modes evidence/native-refinement-modes500/native-20us
          --finer-time evidence/native-refinement-time500/native-20us --output audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-refinement-audit
          path: |
            audit/
            evidence/
          retention-days: 30
