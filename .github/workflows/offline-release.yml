name: Publish offline release assets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prepared draft release tag
        required: true
        default: v0.3.0
        type: string
      evidence_only:
        description: Add supplemental COMSOL evidence while preserving the original release archives
        required: true
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
env:
  WORKAI_RELEASE_TAG: ${{ inputs.tag }}
jobs:
  package:
    if: ${{ !inputs.evidence_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned runtime and dependencies
        run: python tools/download-offline.py --cache build-cache --platform ${{ matrix.platform }}
      - name: Compute example and assemble the offline archive
        env:
          WORKAI_BUILD_COMMIT: ${{ github.sha }}
        run: python tools/build-offline.py --cache build-cache --output portable --platform ${{ matrix.platform }} --example --archive
      - name: Verify archive and write its checksum
        env:
          WORKAI_PACKAGE_PLATFORM: ${{ matrix.platform }}
        shell: python
        run: |
          import hashlib,json,os,zipfile
          from pathlib import Path
          platform=os.environ['WORKAI_PACKAGE_PLATFORM']
          package=next(Path('portable').glob('*.zip'))
          with zipfile.ZipFile(package) as z:
              prefix='WorkAI-Offline-'+platform+'-x64/'
              manifest=json.loads(z.read(prefix+'MANIFEST.json'))
              assert manifest['source_commit']==os.environ['GITHUB_SHA']
              for row in manifest['files']:
                  data=z.read(prefix+row['path'])
                  assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256'],row['path']
              status=json.loads(z.read(prefix+'offline/examples/local-20261024000000000000000000000001/status.json'))
              assert status['phase']=='completed'
              extension=json.loads(z.read(prefix+'offline/model/extension.json'))
              assert status['weights_sha256']==extension['files_sha256']['continued-weights.npz']
              assert status['controls_completed']==3 and status['numerical_correction'] is False
              record=json.loads(z.read(prefix+'offline/examples/local-20261024000000000000000000000001/record/recording.json'))
              assert record['phase']=='completed' and record['duration_us']==5000 and record['frame_count']==25001
          with package.open('rb') as stream:
              digest=hashlib.file_digest(stream,'sha256').hexdigest()
          Path('portable/SHA256SUMS-'+platform+'.txt').write_text(digest+'  '+package.name+'\n')
          print(json.dumps({'platform':platform,'bytes':package.stat().st_size,'sha256':digest,'manifest_files':len(manifest['files'])}))
      - name: Upload to the prepared draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$WORKAI_RELEASE_TAG" portable/*.zip portable/SHA256SUMS-${{ matrix.platform }}.txt --repo "$GITHUB_REPOSITORY" --clobber
  evidence:
    if: ${{ !inputs.evidence_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve the completed frozen 20-case validation
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40058525287
          pattern: long-*
          path: validation-artifacts
      - name: Verify and preserve complete receiver evidence
        run: python tools/package-validation-evidence.py --input validation-artifacts --output evidence
      - name: Upload evidence to the prepared draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$WORKAI_RELEASE_TAG" evidence/*.zip evidence/SHA256SUMS-validation.txt --repo "$GITHUB_REPOSITORY" --clobber
  comsol-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the audited workflow identity
        id: audited
        shell: python
        run: |
          import json,os,re
          from pathlib import Path
          report=json.loads(Path('research/comsol-validation/candidate-matrix20/summary.json').read_text())
          match=re.fullmatch(r'https://github.com/lx016922-dot/workAI/actions/runs/([0-9]+)',report['workflow_run_url'])
          assert match and report['completed_cases']==20 and report['metrics_independently_recomputed']
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('run_id='+match.group(1)+'\n')
      - name: Retrieve the completed constrained-candidate validation
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.audited.outputs.run_id }}
          pattern: comsol-linear-*
          path: comsol-artifacts
      - name: Verify and archive COMSOL and nonlinear physics evidence
        env:
          WORKAI_EVIDENCE_COMMIT: ${{ github.sha }}
        run: python tools/package-comsol-evidence.py --input comsol-artifacts --output comsol-evidence ${{ inputs.evidence_only && '--supplement' || '' }}
      - name: Upload scientific evidence to the prepared draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$WORKAI_RELEASE_TAG" comsol-evidence/*.zip comsol-evidence/SHA256SUMS-comsol*.txt --repo "$GITHUB_REPOSITORY" --clobber
  checksums:
    needs: [package, evidence, comsol-evidence]
    if: ${{ always() && (needs.package.result == 'success' || needs.package.result == 'skipped') && (needs.evidence.result == 'success' || needs.evidence.result == 'skipped') && needs.comsol-evidence.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the combined checksum file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$WORKAI_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS-*.txt' --dir checksums
          cat checksums/SHA256SUMS-*.txt > SHA256SUMS.txt
          gh release upload "$WORKAI_RELEASE_TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
