name: Unit tests
on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['research/**', 'docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [core, solvers, networks]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mesh library for gmsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglu1-mesa
      - name: Pinned numerical runtime
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 -r solid/requirements.txt
      - run: python tools/run-unit-tests.py --group ${{ matrix.group }}
  torch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mesh library for gmsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglu1-mesa
      - name: Pinned numerical runtime and CPU PyTorch
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 -r solid/requirements.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python tools/run-unit-tests.py --group torch
